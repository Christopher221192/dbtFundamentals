version: 2

models:
  - name: stage_jaffle_shop__customers
    description: one unique customer per row
    columns:
      - name: customer_id
        description: primary key
        data_tests:
          - unique
          - not_null


  - name: stage_jaffle_shop__orders
    description: one order per raw
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: status
        description: "{{ doc (order_status)}}"
        data_tests:
          - accepted_values:
              values: ['completed', 'returned']
          