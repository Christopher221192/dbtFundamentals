version: 2

sources:
  - name: jaffle_shop
    database: RAW
    schema: jaffle_shop
    freshness: 
          warn_after:
            period: hour
            count: 6
          error_after:
            period: hour
            count: 12
    loaded_at_field: _etl_loaded_at

    tables:
      - name: customers
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
        freshness: null
        
      - name: orders
        columns:
          - name: id
            data_tests:
              - unique
              - not_null


        


